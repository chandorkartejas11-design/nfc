<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café NFC Wallet</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--primary:#111827;--accent:#7c3aed;--green:#059669;--red:#dc2626;--amber:#d97706;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:19px;display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:10px;background:#111827;color:#fff;display:grid;place-items:center}
.userbox{display:flex;align-items:center;gap:10px}.rolepill{font-size:12px;padding:5px 9px;border-radius:999px;background:#f3e8ff;color:#6d28d9;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:235px;background:#111827;color:#fff;padding:18px 12px;flex-shrink:0}.navtitle{font-size:11px;text-transform:uppercase;color:#9ca3af;margin:8px 10px}.navbtn{width:100%;text-align:left;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:9px;margin:2px 0}.navbtn:hover,.navbtn.active{background:#252d3d;color:#fff}.content{flex:1;padding:24px;max-width:1500px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.pagehead h1{margin:0 0 5px;font-size:27px}.pagehead p{margin:0;color:var(--muted)}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(15,23,42,.03)}.statlabel{color:var(--muted);font-size:13px}.statvalue{font-size:25px;font-weight:800;margin-top:8px}.sectiontitle{font-size:17px;font-weight:750;margin:0 0 14px}
.btn{padding:10px 14px;border-radius:9px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#f3f4f6;color:#111827}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}.warning{background:#f59e0b;color:#fff}.outline{background:#fff;border:1px solid var(--line);color:#111827}.btn:disabled{opacity:.45;cursor:not-allowed}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#fafafa}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:750}.active{background:#dcfce7;color:#166534}.blocked{background:#fee2e2;color:#991b1b}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}
.form{display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#374151}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:9px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#7c3aed;box-shadow:0 0 0 3px #ede9fe}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.money{font-variant-numeric:tabular-nums}.positive{color:var(--green);font-weight:750}.negative{color:var(--red);font-weight:750}
.notice{padding:12px 14px;border-radius:10px;background:#eef2ff;color:#3730a3;font-size:13px;margin-bottom:15px}.warningbox{background:#fff7ed;color:#9a3412}.dangerbox{background:#fef2f2;color:#991b1b}
.loginpage{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f5f3ff,#f8fafc)}.loginwrap{width:min(980px,100%)}.loginhero{text-align:center;margin-bottom:25px}.loginhero h1{font-size:34px;margin:0 0 8px}.loginhero p{color:var(--muted);margin:0}.loginchoices{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.loginchoice{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:left;box-shadow:0 10px 30px rgba(15,23,42,.06);transition:.15s}.loginchoice:hover{transform:translateY(-2px);border-color:#c4b5fd}.choiceicon{font-size:32px;margin-bottom:14px}.loginchoice h2{margin:0 0 8px}.loginchoice p{color:var(--muted);font-size:14px;line-height:1.5}.demo{font-size:12px;color:#6b7280;background:#f9fafb;border-radius:9px;padding:10px;margin-top:14px}
.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 10px 35px rgba(15,23,42,.08)}.back{background:none;color:#6b7280;padding:0;margin-bottom:18px}.loginbox h2{margin:0 0 6px}.loginbox .sub{color:var(--muted);font-size:13px;margin-bottom:20px}.err{background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px;font-size:13px}
.modalback{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(560px,100%);background:#fff;border-radius:16px;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin-top:0}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#f3f4f6;border-radius:8px;width:34px;height:34px}
.billitems{display:grid;gap:8px;margin:12px 0}.billitem{display:flex;justify-content:space-between;padding:9px 10px;background:#f9fafb;border-radius:8px}.total{font-size:21px;font-weight:800;border-top:1px solid var(--line);padding-top:12px}
.empty{text-align:center;color:var(--muted);padding:30px}.kpi{display:flex;justify-content:space-between;gap:15px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;background:#ede9fe;color:#6d28d9;display:grid;place-items:center;font-weight:800}
@media(max-width:900px){.sidebar{width:190px}.stats{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:650px){.topbar{padding:0 12px}.sidebar{display:none}.content{padding:14px}.stats{grid-template-columns:1fr}.loginchoices{grid-template-columns:1fr}.pagehead{gap:10px;flex-direction:column}.userbox span{display:none}}
</style>
</head>
<body>
<div id="app"></div>


<script>
/* Direct route handling for static hosting / GitHub Pages */
(function(){
  const p = window.location.pathname.replace(/\/+$/,"");
  const base = p.match(/^(.*)\/(?:owner\/login|login)$/);
  if (p.endsWith("/owner/login")) {
    window.__CAFE_ROUTE__ = "owner";
  } else if (p.endsWith("/login")) {
    window.__CAFE_ROUTE__ = "member";
  } else {
    window.__CAFE_ROUTE__ = "home";
  }
})();
</script>

<script>
"use strict";

/* =========================================================
   CAFÉ NFC WALLET — SINGLE FILE PROTOTYPE
   Frontend demo only. For production, move auth/wallet logic
   to a secure backend/database and never store passwords here.
========================================================= */

const DB_KEY = "cafeNfcDB_v2";

const defaultDB = {
  users: [
    {id:"USR-M001",name:"Café Master",login:"master@cafe.local",pw:"master123",role:"master"},
    {id:"USR-S001",name:"Café Staff",login:"staff@cafe.local",pw:"staff123",role:"staff"},
    {id:"USR-MBR001",name:"Tejas",login:"tejas@cafe.local",pw:"member123",role:"member",memberId:"MBR-0001"}
  ],
  members: [
    {id:"MBR-0001",name:"Tejas",phone:"9876543210",status:"ACTIVE",cardId:"NFC-0001",balance:5000,createdAt:"2026-10-01T09:00:00"}
  ],
  products: [
    {id:"PRD-001",name:"Chinese Noodles",category:"Food",price:180,active:true},
    {id:"PRD-002",name:"Cold Drink",category:"Beverage",price:60,active:true},
    {id:"PRD-003",name:"Coffee",category:"Beverage",price:100,active:true},
    {id:"PRD-004",name:"Beer",category:"Beverage",price:200,active:true}
  ],
  cards: [
    {id:"CARD-001",uid:"NFC-0001",memberId:"MBR-0001",status:"ACTIVE",issuedAt:"2026-10-01T09:00:00"}
  ],
  transactions: [
    {id:"TXN-20261001-000001",type:"TOPUP",memberId:"MBR-0001",amount:5000,before:0,after:5000,createdBy:"USR-M001",note:"Initial wallet credit",createdAt:"2026-10-01T09:00:00"}
  ],
  topups: [],
  bills: [],
  nextTxn:2,
  nextTopup:1,
  nextBill:1
};

let db = loadDB();
let session = null;
let page = "home";

function loadDB(){
  try{
    const x=JSON.parse(localStorage.getItem(DB_KEY));
    return x && x.users && x.members ? x : structuredClone(defaultDB);
  }catch(e){return structuredClone(defaultDB)}
}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:0,maximumFractionDigits:2})}
function dateTime(x){return new Date(x).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})}
function uid(prefix,counter){return `${prefix}-${new Date().toISOString().slice(0,10).replaceAll("-","")}-${String(counter).padStart(6,"0")}`}
function member(id){return db.members.find(x=>x.id===id)}
function currentUser(){return session ? db.users.find(x=>x.id===session.id) : null}
function canMaster(){return currentUser()?.role==="master"}
function canStaff(){return ["master","staff"].includes(currentUser()?.role)}
function initials(name){return String(name||"?").split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}

function addTransaction({type,memberId,amount,createdBy,note="",billId=null}){
  const m=member(memberId); if(!m) throw Error("Member not found");
  const before=m.balance;
  let after=before;
  if(["TOPUP","BONUS","REFUND","ADJUSTMENT"].includes(type)) after=before+amount;
  if(["PAYMENT","REVERSAL"].includes(type)) after=before-amount;
  if(after<0) throw Error("Insufficient wallet balance");
  m.balance=after;
  const id=uid("TXN",db.nextTxn++);
  db.transactions.unshift({id,type,memberId,amount,before,after,createdBy,note,billId,createdAt:new Date().toISOString()});
  saveDB();
  return {id,before,after};
}

function render(){
  if(!session){renderLogin();return}
  if(session.portal==="member"){renderMemberApp();return}
  renderOwnerApp();
}

function renderLogin(){
  if(page==="memberLogin") return renderLoginForm("member");
  if(page==="ownerLogin") return renderLoginForm("owner");
  document.getElementById("app").innerHTML=`
  <div class="loginpage">
    <div class="loginwrap">
      <div class="loginhero">
        <div class="logo" style="margin:0 auto 12px">☕</div>
        <h1>Café NFC Wallet</h1>
        <p>Closed-loop café wallet, membership and NFC payment system</p>
      </div>
      <div class="loginchoices">
        <div class="loginchoice" onclick="page='memberLogin';render()">
          <div class="choiceicon">👤</div><h2>Member Login</h2>
          <p>View your wallet, NFC card, transactions and request wallet top-ups.</p>
          <div class="demo"><b>Demo:</b> tejas@cafe.local / member123</div>
        </div>
        <div class="loginchoice" onclick="page='ownerLogin';render()">
          <div class="choiceicon">🏪</div><h2>Owner / Staff Login</h2>
          <p>Access POS, members, NFC payments, products, reports and administration.</p>
          <div class="demo"><b>Master:</b> master@cafe.local / master123<br><b>Staff:</b> staff@cafe.local / staff123</div>
        </div>
      </div>
      <p style="text-align:center;color:#9ca3af;font-size:12px;margin-top:20px">Prototype • NFC reader currently simulated in browser</p>
    </div>
  </div>`;
}

function renderLoginForm(type){
  const isMember=type==="member";
  document.getElementById("app").innerHTML=`
  <div class="loginpage">
    <form class="loginbox" onsubmit="login(event,'${type}')">
      <button type="button" class="back" onclick="page='home';render()">← Back</button>
      <h2>${isMember?"Member Login":"Owner / Staff Login"}</h2>
      <div class="sub">${isMember?"Access your personal café wallet":"Master and Staff administration portal"}</div>
      <div id="loginError"></div>
      <div class="form">
        <div class="field"><label>Email / Login</label><input id="login" type="text" required autocomplete="username"></div>
        <div class="field"><label>Password</label><input id="pw" type="password" required autocomplete="current-password"></div>
        <button class="btn primary" type="submit">Login</button>
      </div>
      <div class="demo">${isMember?"Demo: tejas@cafe.local / member123":"Master: master@cafe.local / master123<br>Staff: staff@cafe.local / staff123"}</div>
    </form>
  </div>`;
}

function login(e,type){
  e.preventDefault();
  const u=db.users.find(x=>x.login.toLowerCase()===document.getElementById("login").value.trim().toLowerCase() && x.pw===document.getElementById("pw").value);
  const valid=u && ((type==="member"&&u.role==="member") || (type==="owner"&&["master","staff"].includes(u.role)));
  if(!valid){document.getElementById("loginError").innerHTML='<div class="err" style="margin-bottom:12px">Invalid login or wrong portal.</div>';return}
  session={id:u.id,portal:type};
  page=type==="member"?"dashboard":"dashboard";
  render();
}
function logout(){session=null;page="home";render()}

function shell(role,body){
  const u=currentUser();
  const master=role==="owner"&&u.role==="master";
  const memberPortal=role==="member";
  const nav=memberPortal ? `
    <div class="navtitle">Member</div>
    ${navButton("dashboard","▦","Dashboard")}
    ${navButton("topup","＋","Request Top-up")}
    ${navButton("transactions","↕","My Transactions")}
    ${navButton("card","▣","My NFC Card")}
  ` : `
    <div class="navtitle">Operations</div>
    ${navButton("dashboard","▦","Dashboard")}
    ${navButton("billing","＋","Create Bill")}
    ${navButton("members","♙","Members")}
    ${navButton("transactions","↕",master?"All Transactions":"My Transactions")}
    ${navButton("cards","▣","NFC Cards")}
    ${master?`<div class="navtitle">Administration</div>
      ${navButton("topups","₹","Top-up Requests")}
      ${navButton("products","☷","Products")}
      ${navButton("staff","♟","Staff & Permissions")}`:""}
  `;
  return `<div class="app"><header class="topbar"><div class="brand"><div class="logo">☕</div>Café NFC Wallet</div><div class="userbox"><span>${esc(u.name)}</span><span class="rolepill">${esc(u.role.toUpperCase())}</span><button class="btn secondary" onclick="logout()">Logout</button></div></header>
  <div class="layout"><aside class="sidebar">${nav}</aside><main class="content">${body}</main></div></div>`;
}
function navButton(p,icon,label){return `<button class="navbtn ${page===p?'active':''}" onclick="page='${p}';render()">${icon} &nbsp; ${label}</button>`}

function renderMemberApp(){
  const m=member(currentUser().memberId);
  let body="";
  if(page==="dashboard") body=memberDashboard(m);
  else if(page==="topup") body=memberTopup(m);
  else if(page==="transactions") body=memberTransactions(m);
  else if(page==="card") body=memberCard(m);
  else body=memberDashboard(m);
  document.getElementById("app").innerHTML=shell("member",body);
}
function memberDashboard(m){
  const tx=db.transactions.filter(x=>x.memberId===m.id).slice(0,5);
  return `<div class="pagehead"><div><h1>Welcome, ${esc(m.name)}</h1><p>Your café wallet overview</p></div></div>
  <div class="grid stats">
    <div class="card"><div class="statlabel">Wallet Balance</div><div class="statvalue">${money(m.balance)}</div></div>
    <div class="card"><div class="statlabel">NFC Card</div><div class="statvalue" style="font-size:19px">${esc(m.cardId)}</div></div>
    <div class="card"><div class="statlabel">Card Status</div><div class="statvalue"><span class="badge ${m.status==="ACTIVE"?"active":"blocked"}">${m.status}</span></div></div>
    <div class="card"><div class="statlabel">Transactions</div><div class="statvalue">${db.transactions.filter(x=>x.memberId===m.id).length}</div></div>
  </div>
  <div class="card"><div class="sectiontitle">Recent Transactions</div>${transactionTable(tx)}</div>`;
}
function memberTopup(m){
  const requests=db.topups.filter(x=>x.memberId===m.id);
  return `<div class="pagehead"><div><h1>Request Top-up</h1><p>Ask the café owner to add credits after you make payment.</p></div></div>
  <div class="grid two"><div class="card"><h3 class="sectiontitle">New Request</h3><form class="form" onsubmit="requestTopup(event)">
    <div class="field"><label>Amount (₹)</label><input id="topupAmount" type="number" min="1" step="1" required></div>
    <div class="field"><label>Payment reference / note</label><input id="topupRef" placeholder="UPI reference, cash, etc."></div>
    <button class="btn primary">Submit Top-up Request</button>
  </form></div><div class="card"><h3 class="sectiontitle">Your Requests</h3>${topupTable(requests)}</div></div>`;
}
function requestTopup(e){
  e.preventDefault(); const amount=Number(document.getElementById("topupAmount").value); if(amount<=0)return;
  const id=uid("REQ",db.nextTopup++); db.topups.unshift({id,memberId:currentUser().memberId,amount,reference:document.getElementById("topupRef").value,status:"PENDING",createdAt:new Date().toISOString()});saveDB();alert("Top-up request created: "+id);page="topup";render();
}
function memberTransactions(m){return `<div class="pagehead"><div><h1>My Transactions</h1><p>Complete wallet ledger for your account</p></div></div><div class="card">${transactionTable(db.transactions.filter(x=>x.memberId===m.id))}</div>`}
function memberCard(m){const c=db.cards.find(x=>x.memberId===m.id);return `<div class="pagehead"><div><h1>My NFC Card</h1><p>Your card identifies your wallet account.</p></div></div><div class="card" style="max-width:650px"><div class="kpi"><div><div class="statlabel">Card UID</div><div style="font-size:28px;font-weight:800;margin:8px 0">${esc(c?.uid||m.cardId)}</div><span class="badge ${c?.status==="ACTIVE"?"active":"blocked"}">${c?.status||"UNKNOWN"}</span></div><div class="avatar">NFC</div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="notice">The NFC card stores an identifier only. Your wallet balance is controlled by the café wallet ledger.</div></div>`}

function renderOwnerApp(){
  const u=currentUser(); let body="";
  if(page==="dashboard")body=ownerDashboard();
  else if(page==="billing")body=billing();
  else if(page==="members")body=membersPage();
  else if(page==="transactions")body=ownerTransactions();
  else if(page==="cards")body=cardsPage();
  else if(page==="topups"&&u.role==="master")body=topupsPage();
  else if(page==="products"&&u.role==="master")body=productsPage();
  else if(page==="staff"&&u.role==="master")body=staffPage();
  else body=ownerDashboard();
  document.getElementById("app").innerHTML=shell("owner",body);
}

function ownerDashboard(){
  const today=new Date().toDateString();
  const todayTx=db.transactions.filter(x=>new Date(x.createdAt).toDateString()===today);
  const payments=todayTx.filter(x=>x.type==="PAYMENT").reduce((s,x)=>s+x.amount,0);
  const pending=db.topups.filter(x=>x.status==="PENDING").length;
  return `<div class="pagehead"><div><h1>Owner Dashboard</h1><p>POS and café wallet control center</p></div><button class="btn primary" onclick="page='billing';render()">＋ Create Bill</button></div>
  <div class="grid stats">
    <div class="card"><div class="statlabel">Members</div><div class="statvalue">${db.members.length}</div></div>
    <div class="card"><div class="statlabel">Today's NFC Sales</div><div class="statvalue">${money(payments)}</div></div>
    <div class="card"><div class="statlabel">Pending Top-ups</div><div class="statvalue">${pending}</div></div>
    <div class="card"><div class="statlabel">Transactions</div><div class="statvalue">${db.transactions.length}</div></div>
  </div>
  <div class="grid two"><div class="card"><h3 class="sectiontitle">Quick Actions</h3><div class="row">
    <button class="btn primary" onclick="page='billing';render()">Create Bill</button>
    ${canMaster()?'<button class="btn outline" onclick="page=\\'topups\\';render()">Review Top-ups</button>':''}
    <button class="btn outline" onclick="page='members';render()">Members</button>
  </div></div>
  <div class="card"><h3 class="sectiontitle">Role Permissions</h3><p style="font-size:13px;color:var(--muted);line-height:1.6">${canMaster()?"Master: full access to wallet administration, products, top-ups, members, staff, cards and transactions.":"Staff: POS/billing and NFC payments, member lookup and required card operations. Wallet credit approval and administrative settings are restricted."}</p></div></div>`;
}

let billCart=[];
function billing(){
  const activeProducts=db.products.filter(x=>x.active);
  const cartTotal=billCart.reduce((s,x)=>s+x.price*x.qty,0);
  return `<div class="pagehead"><div><h1>Create Bill</h1><p>Create a bill, select the member card and process payment.</p></div></div>
  <div class="notice">NFC is simulated in this browser version. In the hardware version, the card UID will come from the NFC reader.</div>
  <div class="grid two">
  <div class="card"><h3 class="sectiontitle">1. Add Products</h3><div class="form">
    <div class="field"><label>Product</label><select id="billProduct">${activeProducts.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join("")}</select></div>
    <div class="field"><label>Quantity</label><input id="billQty" type="number" value="1" min="1"></div>
    <button class="btn secondary" onclick="addToBill()">Add to Bill</button>
  </div>${billCart.length?`<div class="billitems">${billCart.map((x,i)=>`<div class="billitem"><span>${esc(x.name)} × ${x.qty}</span><span>${money(x.price*x.qty)} <button class="btn secondary" style="padding:3px 7px;margin-left:6px" onclick="removeBillItem(${i})">×</button></span></div>`).join("")}</div>`:'<div class="empty">No items added.</div>'}
  <div class="total">Total: ${money(cartTotal)}</div></div>
  <div class="card"><h3 class="sectiontitle">2. Member & NFC Payment</h3><div class="form">
    <div class="field"><label>Member / NFC Card</label><select id="billMember">${db.cards.filter(c=>c.status==="ACTIVE").map(c=>{let m=member(c.memberId);return `<option value="${c.uid}">${esc(m.name)} — ${esc(c.uid)} — ${money(m.balance)}</option>`}).join("")}</select></div>
    <button class="btn success" ${billCart.length?"":"disabled"} onclick="processNfcPayment()">Tap NFC Card & Pay ${money(cartTotal)}</button>
    <div class="notice" style="margin:0">The system checks card status and available wallet balance before creating the payment transaction.</div>
  </div></div></div>`;
}
function addToBill(){const p=db.products.find(x=>x.id===document.getElementById("billProduct").value);const qty=Math.max(1,Number(document.getElementById("billQty").value)||1);if(p){const old=billCart.find(x=>x.id===p.id);if(old)old.qty+=qty;else billCart.push({...p,qty});render()}}
function removeBillItem(i){billCart.splice(i,1);render()}
function processNfcPayment(){
  const uid=document.getElementById("billMember").value;
  const card=db.cards.find(x=>x.uid===uid);
  const m=member(card?.memberId);
  const total=billCart.reduce((s,x)=>s+x.price*x.qty,0);
  if(!card||card.status!=="ACTIVE")return alert("Card is blocked or not found.");
  if(!m||m.status!=="ACTIVE")return alert("Member is inactive.");
  if(m.balance<total)return alert(`Insufficient balance. Available: ${money(m.balance)} | Required: ${money(total)}`);
  const billId=`BILL-${new Date().toISOString().slice(0,10).replaceAll("-","")}-${String(db.nextBill++).padStart(5,"0")}`;
  const b={id:billId,memberId:m.id,staffId:currentUser().id,total,items:structuredClone(billCart),status:"PAID",createdAt:new Date().toISOString()};
  const result=addTransaction({type:"PAYMENT",memberId:m.id,amount:total,createdBy:currentUser().id,note:"NFC wallet payment",billId});
  db.bills.unshift(b);saveDB();billCart=[];
  showModal(`<div class="modal"><div class="modalhead"><h2>Payment Successful</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">NFC payment completed successfully.</div><div class="card" style="background:#f9fafb"><p><b>Transaction ID</b><br><span style="font-size:20px">${result.id}</span></p><p><b>Bill ID</b><br>${billId}</p><p><b>Member</b><br>${esc(m.name)} (${esc(card.uid)})</p><p><b>Amount</b><br><span style="font-size:25px;font-weight:800">${money(total)}</span></p><p><b>Balance</b><br>${money(result.before)} → <b>${money(result.after)}</b></p></div><button class="btn primary" style="margin-top:15px" onclick="closeModal();page='billing';render()">Done</button></div>`);
}

function membersPage(){
  return `<div class="pagehead"><div><h1>Members</h1><p>View member accounts and wallet status.</p></div>${canMaster()?'<button class="btn primary" onclick="showAddMember()">＋ Add Member</button>':''}</div>
  <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Member</th><th>Phone</th><th>Card</th><th>Wallet</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.members.map(m=>`<tr><td><b>${esc(m.name)}</b><br><small>${m.id}</small></td><td>${esc(m.phone)}</td><td>${esc(m.cardId)}</td><td class="money">${money(m.balance)}</td><td><span class="badge ${m.status==="ACTIVE"?"active":"blocked"}">${m.status}</span></td><td>${canMaster()?`<button class="btn outline" onclick="toggleMember('${m.id}')">${m.status==="ACTIVE"?"Block":"Activate"}</button>`:"View only"}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function toggleMember(id){const m=member(id);m.status=m.status==="ACTIVE"?"BLOCKED":"ACTIVE";const c=db.cards.find(x=>x.memberId===id);if(c)c.status=m.status;saveDB();render()}
function showAddMember(){showModal(`<div class="modal"><div class="modalhead"><h2>Add Member</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="addMember(event)"><div class="field"><label>Name</label><input id="nm" required></div><div class="field"><label>Phone</label><input id="ph" required></div><div class="field"><label>Card UID</label><input id="uid" placeholder="NFC-0002" required></div><div class="field"><label>Login email</label><input id="em" type="email" required></div><div class="field"><label>Temporary password</label><input id="pass" required></div><button class="btn primary">Create Member</button></form></div>`)}
function addMember(e){e.preventDefault();const id=`MBR-${String(db.members.length+1).padStart(4,"0")}`;const uid=document.getElementById("uid").value.trim();if(db.cards.some(c=>c.uid===uid))return alert("Card UID already exists.");db.members.push({id,name:document.getElementById("nm").value,phone:document.getElementById("ph").value,status:"ACTIVE",cardId:uid,balance:0,createdAt:new Date().toISOString()});db.cards.push({id:"CARD-"+String(db.cards.length+1).padStart(3,"0"),uid,memberId:id,status:"ACTIVE",issuedAt:new Date().toISOString()});db.users.push({id:"USR-"+id,name:document.getElementById("nm").value,login:document.getElementById("em").value,pw:document.getElementById("pass").value,role:"member",memberId:id});saveDB();closeModal();render()}

function ownerTransactions(){
  let tx=db.transactions;
  if(currentUser().role==="staff")tx=tx.filter(x=>x.createdBy===currentUser().id);
  return `<div class="pagehead"><div><h1>${canMaster()?"All Transactions":"My Transactions"}</h1><p>Every wallet movement has a permanent unique transaction ID.</p></div></div><div class="card">${transactionTable(tx,true)}</div>`;
}
function transactionTable(tx,owner=false){
  if(!tx.length)return '<div class="empty">No transactions found.</div>';
  return `<div class="tablewrap"><table class="table"><thead><tr><th>Transaction ID</th><th>Type</th><th>Member</th><th>Amount</th><th>Balance</th><th>Created</th></tr></thead><tbody>${tx.map(t=>{const m=member(t.memberId);return `<tr><td><b>${esc(t.id)}</b>${t.billId?`<br><small>${esc(t.billId)}</small>`:""}</td><td><span class="badge ${t.type==="PAYMENT"?"approved":"pending"}">${t.type}</span></td><td>${esc(m?.name||"Unknown")}</td><td class="${t.type==="PAYMENT"?"negative":"positive"}">${t.type==="PAYMENT"?"-":"+"}${money(t.amount)}</td><td>${money(t.before)} → ${money(t.after)}</td><td>${dateTime(t.createdAt)}</td></tr>`}).join("")}</tbody></table></div>`;
}
function topupTable(xs){
  if(!xs.length)return '<div class="empty">No top-up requests.</div>';
  return `<div class="tablewrap"><table class="table"><thead><tr><th>Request ID</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>${xs.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${money(x.amount)}</td><td><span class="badge ${x.status.toLowerCase()}">${x.status}</span></td><td>${dateTime(x.createdAt)}</td></tr>`).join("")}</tbody></table></div>`;
}

function topupsPage(){
  return `<div class="pagehead"><div><h1>Top-up Requests</h1><p>Master approval is required before wallet credits are added.</p></div></div>
  <div class="card">${db.topups.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Request ID</th><th>Member</th><th>Amount</th><th>Reference</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.topups.map(x=>{const m=member(x.memberId);return `<tr><td>${esc(x.id)}</td><td>${esc(m?.name||"Unknown")}</td><td>${money(x.amount)}</td><td>${esc(x.reference||"-")}</td><td><span class="badge ${x.status.toLowerCase()}">${x.status}</span></td><td>${x.status==="PENDING"?`<button class="btn success" onclick="approveTopup('${x.id}')">Approve</button> <button class="btn danger" onclick="rejectTopup('${x.id}')">Reject</button>`:"Reviewed"}</td></tr>`}).join("")}</tbody></table></div>`:'<div class="empty">No top-up requests.</div>'}</div>`;
}
function approveTopup(id){const r=db.topups.find(x=>x.id===id);if(!r||r.status!=="PENDING")return;const result=addTransaction({type:"TOPUP",memberId:r.memberId,amount:r.amount,createdBy:currentUser().id,note:"Approved top-up "+r.id});r.status="APPROVED";r.reviewedBy=currentUser().id;r.reviewedAt=new Date().toISOString();saveDB();alert(`Approved ${r.id}. Transaction: ${result.id}`);render()}
function rejectTopup(id){const r=db.topups.find(x=>x.id===id);if(!r||r.status!=="PENDING")return;r.status="REJECTED";r.reviewedBy=currentUser().id;r.reviewedAt=new Date().toISOString();saveDB();render()}

function productsPage(){
  return `<div class="pagehead"><div><h1>Products</h1><p>Manage products available in POS billing.</p></div><button class="btn primary" onclick="showAddProduct()">＋ Add Product</button></div>
  <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td><span class="badge ${p.active?"active":"blocked"}">${p.active?"ACTIVE":"INACTIVE"}</span></td><td><button class="btn outline" onclick="toggleProduct('${p.id}')">${p.active?"Disable":"Enable"}</button></td></tr>`).join("")}</tbody></table></div></div>`;
}
function toggleProduct(id){const p=db.products.find(x=>x.id===id);p.active=!p.active;saveDB();render()}
function showAddProduct(){showModal(`<div class="modal"><div class="modalhead"><h2>Add Product</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="addProduct(event)"><div class="field"><label>Name</label><input id="pn" required></div><div class="field"><label>Category</label><input id="pc" required></div><div class="field"><label>Price (₹)</label><input id="pp" type="number" min="0" required></div><button class="btn primary">Add Product</button></form></div>`)}
function addProduct(e){e.preventDefault();db.products.push({id:"PRD-"+String(db.products.length+1).padStart(3,"0"),name:document.getElementById("pn").value,category:document.getElementById("pc").value,price:Number(document.getElementById("pp").value),active:true});saveDB();closeModal();render()}

function cardsPage(){
  return `<div class="pagehead"><div><h1>NFC Cards</h1><p>Card identifiers and status.</p></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Card UID</th><th>Member</th><th>Status</th><th>Issued</th><th>Action</th></tr></thead><tbody>${db.cards.map(c=>{const m=member(c.memberId);return `<tr><td><b>${esc(c.uid)}</b></td><td>${esc(m?.name||"Unknown")}</td><td><span class="badge ${c.status==="ACTIVE"?"active":"blocked"}">${c.status}</span></td><td>${dateTime(c.issuedAt)}</td><td>${canMaster()?`<button class="btn outline" onclick="toggleCard('${c.id}')">${c.status==="ACTIVE"?"Block Card":"Activate Card"}</button>`:"View only"}</td></tr>`}).join("")}</tbody></table></div></div>`;
}
function toggleCard(id){const c=db.cards.find(x=>x.id===id);c.status=c.status==="ACTIVE"?"BLOCKED":"ACTIVE";const m=member(c.memberId);if(m)m.status=c.status;saveDB();render()}

function staffPage(){
  const staff=db.users.filter(x=>x.role==="staff");
  return `<div class="pagehead"><div><h1>Staff & Permissions</h1><p>Master-only administration of staff accounts.</p></div><button class="btn primary" onclick="showAddStaff()">＋ Add Staff</button></div>
  <div class="card"><h3 class="sectiontitle">Permission Matrix</h3><div class="tablewrap"><table class="table"><thead><tr><th>Capability</th><th>Master</th><th>Staff</th></tr></thead><tbody>
  ${["Create bills / NFC payments","View members","Add wallet credits","Approve top-ups","Manage products","Manage NFC cards","Manage staff","Delete/alter ledger history","System settings"].map((x,i)=>`<tr><td>${x}</td><td>✓</td><td>${i<2?"✓":"—"}</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="card" style="margin-top:16px"><h3 class="sectiontitle">Staff Accounts</h3>${staff.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Login</th><th>Role</th></tr></thead><tbody>${staff.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.login)}</td><td><span class="rolepill">STAFF</span></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No staff accounts.</div>'}</div>`;
}
function showAddStaff(){showModal(`<div class="modal"><div class="modalhead"><h2>Add Staff</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="addStaff(event)"><div class="field"><label>Name</label><input id="sn" required></div><div class="field"><label>Login email</label><input id="se" type="email" required></div><div class="field"><label>Password</label><input id="sp" required></div><button class="btn primary">Create Staff</button></form></div>`)}
function addStaff(e){e.preventDefault();db.users.push({id:"USR-S"+String(db.users.filter(x=>x.role==="staff").length+1).padStart(3,"0"),name:document.getElementById("sn").value,login:document.getElementById("se").value,pw:document.getElementById("sp").value,role:"staff"});saveDB();closeModal();render()}

function showModal(inner){let el=document.createElement("div");el.id="modalback";el.className="modalback";el.innerHTML=inner;document.body.appendChild(el)}
function closeModal(){document.getElementById("modalback")?.remove()}

window.addEventListener("storage",()=>{db=loadDB();render()});
(function startRoute(){
  if (window.__CAFE_ROUTE__ === "member") page = "memberLogin";
  else if (window.__CAFE_ROUTE__ === "owner") page = "ownerLogin";
  else page = "home";
  render();
})();
</script>

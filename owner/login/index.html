<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner / Staff Login | Café Wallet</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090c0f;color:#f5f7fa;font:14px Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:min(410px,92%);background:#12171d;border:1px solid #29313a;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0008}
.back{display:inline-block;margin-bottom:22px;color:#b9c3cf;text-decoration:none;font-weight:700}.back:hover{color:#f5b83d}
.logo{width:46px;height:46px;border-radius:13px;background:#f5b83d;color:#111;display:grid;place-items:center;font-size:22px;margin-bottom:18px}
.badge{display:inline-block;background:#3a2d0b;color:#f5c34e;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;margin-bottom:12px}
h1{margin:0 0 8px;font-size:26px}p{color:#9eabb8;line-height:1.5}
label{display:block;margin:19px 0 7px;font-weight:700;font-size:13px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #303944;background:#090d11;color:#fff;outline:none}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#f5b83d;color:#111;font-weight:800;cursor:pointer}
.error{display:none;color:#ff7777;margin-top:10px;font-size:12px}
.demo{margin-top:16px;padding:13px;background:#0c1015;border-radius:10px;color:#82909e;font-size:12px;line-height:1.7}
.demo b{color:#c5ced8}
</style>
</head>
<body>
<div class="card">
<a class="back" href="/nfc/">← Back to Café</a>
<div class="logo">☕</div>
<div class="badge">OWNER PORTAL</div>
<h1>Owner / Staff Login</h1>
<p>Access the café management system according to your assigned role.</p>
<form id="loginForm">
<label>Email / Login</label>
<input id="email" autocomplete="username" required>
<label>Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<div id="error" class="error">Invalid owner/staff login details.</div>
<button type="submit">Login</button>
</form>
<div class="demo"><b>Master</b><br>master@cafe.local / master123<br><br><b>Staff</b><br>staff@cafe.local / staff123</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',function(e){
 e.preventDefault();
 const email=document.getElementById('email').value.trim().toLowerCase();
 const password=document.getElementById('password').value;
 let role=null;
 if(email==='master@cafe.local' && password==='master123') role='master';
 else if(email==='staff@cafe.local' && password==='staff123') role='staff';
 if(!role){document.getElementById('error').style.display='block';return;}
 localStorage.setItem('cafeNfcSession',JSON.stringify({role:role,email:email}));
 window.location.href = role==='master' ? '/nfc/owner/master/' : '/nfc/owner/staff/';
});
</script>
</body>
</html>

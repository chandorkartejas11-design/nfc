<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café NFC Wallet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#18202a}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.hidden{display:none!important}.app{min-height:100vh}.top{height:64px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900;letter-spacing:.3px}.top button{background:#374151;color:white}.shell{display:flex;min-height:calc(100vh - 64px)}.side{width:230px;background:#fff;border-right:1px solid #e5e7eb;padding:18px}.side button{width:100%;text-align:left;background:transparent;margin:3px 0}.side button.active,.side button:hover{background:#eef2ff}.main{flex:1;padding:26px;max-width:1400px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111827,#4338ca)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.05)}.login .card{width:min(420px,92vw)}h1,h2,h3{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px}.primary{background:#4f46e5;color:white}.success{background:#059669;color:white}.danger{background:#dc2626;color:white}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat strong{font-size:27px;display:block;margin-top:8px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #edf0f3;text-align:left;font-size:14px}.pill{padding:4px 8px;border-radius:99px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:800}.section{margin-top:20px}.cols{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.product{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.cart-line{display:flex;justify-content:space-between;padding:9px 0}.total{font-size:22px;font-weight:900;border-top:1px solid #ddd;padding-top:12px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:13px 16px;border-radius:10px;display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}.modal .card{width:min(500px,95vw)}.tag{font-size:11px;font-weight:800;color:#4f46e5}.balance{font-size:42px;font-weight:900}.nfc{border:2px dashed #6366f1;padding:24px;text-align:center;border-radius:14px;background:#eef2ff}.successbox{padding:18px;border-radius:12px;background:#ecfdf5;color:#065f46}.dangerbox{padding:18px;border-radius:12px;background:#fef2f2;color:#991b1b}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.side{width:190px}}@media(max-width:650px){.shell{display:block}.side{width:100%;display:flex;overflow:auto}.side button{min-width:max-content}.main{padding:16px}.grid{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div id="login" class="login"><div class="card"><div class="tag">CAFÉ NFC WALLET</div><h1>Welcome back</h1><p class="muted">Prototype login. Use the demo accounts below.</p><div class="field"><label>Login ID</label><input id="loginId" value="owner@cafe.local"></div><div class="field"><label>Password</label><input id="loginPw" type="password" value="owner123"></div><button class="primary" style="width:100%" onclick="login()">Sign in</button><p class="muted" style="font-size:12px;margin-top:14px">Owner: owner@cafe.local / owner123<br>Member: tejas@cafe.local / member123</p></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">☕ Café NFC Wallet</div><div><span id="userLabel"></span> <button onclick="logout()">Logout</button></div></header><div class="shell"><aside class="side" id="nav"></aside><main class="main" id="main"></main></div></div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script>
const state={user:null,page:'dashboard',cart:[],pendingNfc:false};
let db=JSON.parse(localStorage.getItem('cafeNfcDB')||'null')||{users:[{id:1,name:'Café Owner',login:'owner@cafe.local',pw:'owner123',role:'owner'},{id:2,name:'Tejas',login:'tejas@cafe.local',pw:'member123',role:'member',memberId:1}],members:[{id:1,name:'Tejas',phone:'9876543210',login:'tejas@cafe.local',cardId:'NFC-0001',status:'ACTIVE',balance:5000}],products:[{id:1,name:'Chinese Noodles',price:180,category:'Food',active:true},{id:2,name:'Cold Drink',price:60,category:'Beverage',active:true},{id:3,name:'Coffee',price:100,category:'Beverage',active:true},{id:4,name:'Beer',price:200,category:'Beverage',active:true}],transactions:[],topups:[]};
function save(){localStorage.setItem('cafeNfcDB',JSON.stringify(db))} function money(n){return '₹'+Number(n).toLocaleString('en-IN')} function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function login(){const id=loginId.value.trim(),pw=loginPw.value;const u=db.users.find(x=>x.login===id&&x.pw===pw);if(!u)return toast('Invalid login');state.user=u;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userLabel').textContent=u.name;renderNav();render()}
function logout(){state.user=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function renderNav(){const owner=state.user.role==='owner';const items=owner?[['dashboard','Dashboard'],['billing','Create Bill'],['members','Members'],['topups','Top-up Requests'],['products','Products'],['transactions','Transactions'],['cards','NFC Cards']]:[['dashboard','My Wallet'],['topup','Top Up'],['transactions','Transactions'],['card','My NFC Card']];document.getElementById('nav').innerHTML=items.map(([id,l])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${l}</button>`).join('')}
function go(p){state.page=p;renderNav();render()}
function render(){const m=document.getElementById('main');m.innerHTML=''; if(state.user.role==='owner') ownerRender(m); else memberRender(m)}
function ownerRender(m){if(state.page==='dashboard')return ownerDash(m);if(state.page==='billing')return billing(m);if(state.page==='members')return members(m);if(state.page==='topups')return topups(m);if(state.page==='products')return products(m);if(state.page==='transactions')return transactions(m,true);if(state.page==='cards')return cards(m)}
function ownerDash(m){const sales=db.transactions.filter(t=>t.type==='PAYMENT').reduce((a,t)=>a+t.amount,0);m.innerHTML=`<h1>Owner Dashboard</h1><p class="muted">Manage members, wallets, products and café payments.</p><div class="grid"><div class="card stat">Today's sales<strong>${money(sales)}</strong></div><div class="card stat">Transactions<strong>${db.transactions.length}</strong></div><div class="card stat">Members<strong>${db.members.length}</strong></div><div class="card stat">Coins outstanding<strong>${db.members.reduce((a,x)=>a+x.balance,0).toLocaleString('en-IN')}</strong></div></div><div class="section cols"><div class="card"><h2>Quick actions</h2><button class="primary" onclick="go('billing')">Create Bill</button> <button onclick="go('members')">Members</button> <button onclick="go('topups')">Review Top-ups</button></div><div class="card"><h2>System</h2><p class="muted">NFC is currently in browser simulation mode.</p><span class="pill">Prototype Online</span></div></div>`}
function billing(m){m.innerHTML=`<div class="row"><div><h1>Create Bill</h1><p class="muted">Build the customer's bill, then collect payment through NFC.</p></div><button onclick="state.cart=[];render()">Clear</button></div><div class="cols"><div class="card"><h2>Products</h2>${db.products.filter(p=>p.active).map(p=>`<div class="product"><div><b>${p.name}</b><div class="muted">${p.category} · ${money(p.price)}</div></div><button onclick="addCart(${p.id})">Add</button></div>`).join('')}</div><div class="card"><h2>Current Bill</h2>${state.cart.length?state.cart.map((x,i)=>`<div class="cart-line"><span>${x.name} × ${x.qty}</span><span>${money(x.price*x.qty)}</span></div>`).join(''):'<p class="muted">No items added.</p>'}<div class="total">Total: ${money(state.cart.reduce((a,x)=>a+x.price*x.qty,0))}</div><div class="section"><button class="primary" style="width:100%" onclick="startNfc()" ${!state.cart.length?'disabled':''}>Tap NFC to Pay</button></div></div></div>`}
function addCart(id){const p=db.products.find(x=>x.id===id),x=state.cart.find(x=>x.id===id);if(x)x.qty++;else state.cart.push({...p,qty:1});render()}
function startNfc(){const total=state.cart.reduce((a,x)=>a+x.price*x.qty,0);document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="card"><div class="nfc"><h2>Tap NFC Card</h2><p class="muted">Waiting for customer card…</p><div style="font-size:45px">◉</div><b>${money(total)} to pay</b></div><div style="margin-top:14px"><label>Simulation card</label><select id="simCard" style="width:100%;padding:10px;margin-top:6px">${db.members.filter(x=>x.status==='ACTIVE').map(x=>`<option value="${x.id}">${x.name} — ${x.cardId} — ${x.balance} coins</option>`).join('')}</select></div><div style="margin-top:14px"><button class="success" style="width:100%" onclick="processNfc()">Simulate Tap</button><button style="width:100%;margin-top:8px" onclick="closeModal()">Cancel</button></div></div>`}
function processNfc(){const member=db.members.find(x=>x.id==document.getElementById('simCard').value),total=state.cart.reduce((a,x)=>a+x.price*x.qty,0);if(member.balance<total){document.getElementById('modal').innerHTML=`<div class="card"><div class="dangerbox"><h2>Payment Declined</h2><p>Insufficient wallet balance.</p><b>Available: ${money(member.balance)} · Required: ${money(total)}</b></div><button style="width:100%;margin-top:12px" onclick="closeModal()">Close</button></div>`;return}const before=member.balance;member.balance-=total;db.transactions.unshift({id:'TXN-'+Date.now(),memberId:member.id,member:member.name,type:'PAYMENT',amount:total,before,after:member.balance,details:state.cart.map(x=>`${x.name} ×${x.qty}`).join(', '),created:new Date().toLocaleString()});save();state.cart=[];document.getElementById('modal').innerHTML=`<div class="card"><div class="successbox"><h2>✓ Payment Successful</h2><p>${member.name}</p><b>${money(total)} paid</b><p>Remaining balance: ${money(member.balance)}</p></div><button class="primary" style="width:100%;margin-top:12px" onclick="closeModal();go('billing')">Done</button></div>`}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML='';render()}
function members(m){m.innerHTML=`<div class="row"><div><h1>Members</h1><p class="muted">Customer accounts and wallet balances.</p></div><button class="primary" onclick="newMember()">Add Member</button></div><div class="card section"><table class="table"><tr><th>Member</th><th>Card</th><th>Balance</th><th>Status</th><th>Action</th></tr>${db.members.map(x=>`<tr><td><b>${x.name}</b><br><span class="muted">${x.phone}</span></td><td>${x.cardId}</td><td>${x.balance.toLocaleString('en-IN')} coins</td><td><span class="pill">${x.status}</span></td><td><button onclick="addCoins(${x.id})">Add Coins</button></td></tr>`).join('')}</table></div>`}
function newMember(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="card"><h2>Add Member</h2><div class="field"><label>Name</label><input id="mn"></div><div class="field"><label>Phone</label><input id="mp"></div><div class="field"><label>Login ID</label><input id="ml"></div><div class="field"><label>Password</label><input id="mw" value="member123"></div><button class="primary" onclick="createMember()">Create Member</button> <button onclick="closeModal()">Cancel</button></div>`}
function createMember(){const id=db.members.length+1,name=mn.value,phone=mp.value,login=ml.value,pw=mw.value;if(!name||!login)return toast('Name and login required');db.members.push({id,name,phone,login,cardId:'NFC-'+String(id).padStart(4,'0'),status:'ACTIVE',balance:0});db.users.push({id:db.users.length+1,name,login,pw,role:'member',memberId:id});save();closeModal();toast('Member created')}
function addCoins(id){const x=db.members.find(m=>m.id===id);document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="card"><h2>Add Coins</h2><p><b>${x.name}</b> · Current: ${x.balance} coins</p><div class="field"><label>Coins / ₹</label><input id="coinAmt" type="number" min="1" value="5000"></div><div class="field"><label>Reference</label><input id="coinRef" placeholder="UPI / cash receipt / other"></div><button class="success" onclick="confirmCoins(${id})">Add to Wallet</button> <button onclick="closeModal()">Cancel</button></div>`}
function confirmCoins(id){const x=db.members.find(m=>m.id===id),amt=Number(coinAmt.value);if(!amt)return;const before=x.balance;x.balance+=amt;db.transactions.unshift({id:'TOP-'+Date.now(),memberId:id,member:x.name,type:'TOPUP',amount:amt,before,after:x.balance,details:'Owner wallet credit',created:new Date().toLocaleString()});save();closeModal();toast(`${amt} coins added`)}
function topups(m){m.innerHTML=`<h1>Top-up Requests</h1><p class="muted">Approve customer requests only after the real-world payment is verified.</p><div class="card section"><table class="table"><tr><th>Member</th><th>Amount</th><th>Status</th><th>Action</th></tr>${db.topups.length?db.topups.map(x=>`<tr><td>${x.member}</td><td>${money(x.amount)}</td><td>${x.status}</td><td>${x.status==='PENDING'?`<button class="success" onclick="approveTopup('${x.id}')">Approve</button> <button class="danger" onclick="rejectTopup('${x.id}')">Reject</button>`:'-'}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No requests yet.</td></tr>'}</table></div>`}
function approveTopup(id){const t=db.topups.find(x=>x.id===id),m=db.members.find(x=>x.id===t.memberId);if(t.status!=='PENDING')return;const before=m.balance;m.balance+=t.amount;t.status='APPROVED';db.transactions.unshift({id:'TOP-'+Date.now(),memberId:m.id,member:m.name,type:'TOPUP',amount:t.amount,before,after:m.balance,details:'Approved customer top-up',created:new Date().toLocaleString()});save();render();toast('Top-up approved')}
function rejectTopup(id){const t=db.topups.find(x=>x.id===id);t.status='REJECTED';save();render();toast('Top-up rejected')}
function products(m){m.innerHTML=`<div class="row"><div><h1>Products</h1><p class="muted">Manage the café menu and prices.</p></div><button class="primary" onclick="newProduct()">Add Product</button></div><div class="card section"><table class="table"><tr><th>Product</th><th>Category</th><th>Price</th><th>Status</th></tr>${db.products.map(x=>`<tr><td>${x.name}</td><td>${x.category}</td><td>${money(x.price)}</td><td>${x.active?'Active':'Disabled'}</td></tr>`).join('')}</table></div>`}
function newProduct(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="card"><h2>Add Product</h2><div class="field"><label>Name</label><input id="pn"></div><div class="field"><label>Category</label><input id="pc" value="Food"></div><div class="field"><label>Price</label><input id="pp" type="number"></div><button class="primary" onclick="createProduct()">Add Product</button> <button onclick="closeModal()">Cancel</button></div>`}
function createProduct(){const name=pn.value,category=pc.value,price=Number(pp.value);if(!name||!price)return;db.products.push({id:Date.now(),name,category,price,active:true});save();closeModal();toast('Product added')}
function transactions(m,owner){m.innerHTML=`<h1>Transactions</h1><p class="muted">Complete wallet ledger.</p><div class="card section"><table class="table"><tr><th>Date</th><th>Member</th><th>Type</th><th>Amount</th><th>Balance</th><th>Details</th></tr>${db.transactions.map(t=>`<tr><td>${t.created}</td><td>${t.member}</td><td>${t.type}</td><td>${t.type==='PAYMENT'?'-':'+'}${money(t.amount)}</td><td>${money(t.after)}</td><td>${t.details||''}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No transactions yet.</td></tr>'}</table></div>`}
function cards(m){m.innerHTML=`<h1>NFC Cards</h1><p class="muted">Cards are identifiers; wallet balances live on the server.</p><div class="card section"><table class="table"><tr><th>Card ID</th><th>Member</th><th>Balance</th><th>Status</th><th>Action</th></tr>${db.members.map(x=>`<tr><td>${x.cardId}</td><td>${x.name}</td><td>${x.balance} coins</td><td>${x.status}</td><td><button onclick="toggleCard(${x.id})">${x.status==='ACTIVE'?'Block':'Activate'}</button></td></tr>`).join('')}</table></div>`}
function toggleCard(id){const x=db.members.find(m=>m.id===id);x.status=x.status==='ACTIVE'?'BLOCKED':'ACTIVE';save();render()}
function memberRender(m){const me=db.members.find(x=>x.id===state.user.memberId);if(state.page==='dashboard')return memberDash(m,me);if(state.page==='topup')return memberTopup(m,me);if(state.page==='transactions')return transactions(m,false);if(state.page==='card')return memberCard(m,me)}
function memberDash(m,me){m.innerHTML=`<h1>Hello, ${me.name}</h1><p class="muted">Your café wallet.</p><div class="grid"><div class="card stat">Available balance<strong>${me.balance.toLocaleString('en-IN')} coins</strong></div><div class="card stat">Card status<strong>${me.status}</strong></div></div><div class="card section"><h2>Wallet</h2><div class="balance">${money(me.balance)}</div><p class="muted">1 coin is currently configured as ₹1 of café spending value.</p><button class="primary" onclick="go('topup')">Request Top-up</button></div>`}
function memberTopup(m,me){m.innerHTML=`<h1>Top Up Wallet</h1><p class="muted">Submit a request after making the real payment to the café.</p><div class="card" style="max-width:520px"><div class="field"><label>Amount</label><input id="topAmt" type="number" min="1" placeholder="5000"></div><div class="field"><label>Payment reference / acknowledgement</label><input id="topRef" placeholder="UPI reference, receipt number, etc."></div><button class="primary" onclick="requestTopup(${me.id})">Submit Request</button><div class="section"><h3>Your requests</h3>${db.topups.filter(x=>x.memberId===me.id).map(x=>`<p>${money(x.amount)} — <b>${x.status}</b></p>`).join('')||'<p class="muted">No requests yet.</p>'}</div></div>`}
function requestTopup(id){const amount=Number(topAmt.value);if(!amount)return toast('Enter an amount');db.topups.unshift({id:'REQ-'+Date.now(),memberId:id,member:db.members.find(x=>x.id===id).name,amount,reference:topRef.value,status:'PENDING'});save();toast('Top-up request submitted');render()}
function memberCard(m,me){m.innerHTML=`<h1>My NFC Card</h1><div class="card" style="max-width:520px"><div class="nfc"><div class="tag">CAFÉ NFC MEMBER CARD</div><h2>${me.name}</h2><div style="font-size:30px;font-weight:900;margin:18px 0">${me.cardId}</div><span class="pill">${me.status}</span></div><div class="section"><p><b>Wallet:</b> ${me.balance.toLocaleString('en-IN')} coins</p><p class="muted">If this card is lost, contact the café owner to block it. Your wallet balance remains on your account.</p></div></div>`}
</script></body></html>
